<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slotit - Register</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .login-logo {
            font-size: 32px;
            margin-bottom: 16px;
            text-align: center;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }
        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            text-align: center;
        }
        .role-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo animate-in">⚽</div>
        
        <div class="card auth-card animate-in" style="animation-delay: 0.1s;">
            <h1 class="auth-title">Create Account</h1>

            <div class="role-selector">
                <div class="role-btn active" onclick="selectRole('player')" id="role-player">🏃 Player</div>
                <div class="role-btn" onclick="selectRole('owner')" id="role-owner">🏟️ Venue Owner</div>
            </div>

            <form id="registerForm">
                <input type="hidden" id="selectedRole" value="player">
                
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="input-field" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="input-field" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg mt-24">Create Account</button>
            </form>

            <div class="text-center mt-24">
                <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Already have an account? Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function selectRole(role) {
            document.getElementById('selectedRole').value = role;
            document.getElementById('role-player').classList.toggle('active', role === 'player');
            document.getElementById('role-owner').classList.toggle('active', role === 'owner');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const cpwd = document.getElementById('confirmPassword').value;

            if (pwd !== cpwd) {
                showToast('Passwords do not match', 'error');
                return;
            }

            const data = {
                name: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: pwd,
                role: document.getElementById('selectedRole').value
            };

            try {
                await apiCall('/auth/register', 'POST', data);
                showToast('Registration successful! Please login.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } catch (err) {
                if (!err.isNetwork) {
                    showToast(err.message || 'Registration failed', 'error');
                    return;
                }
                showToast('Offline demo data – account created (Mock)', 'info');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            }
        });
    </script>
</body>
</html>
