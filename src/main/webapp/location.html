<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slotit - Location</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .loc-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .loc-icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        .loc-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .loc-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 300px;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 32px 0;
            width: 100%;
            max-width: 300px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }
        
        .city-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 300px;
        }
        .city-pill {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: white;
            border: 1.5px solid var(--border);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .city-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="loc-wrapper animate-in">
        <div class="loc-icon">📍</div>
        <h1 class="loc-title">Find Turfs Near You</h1>
        <p class="loc-subtitle">Allow location access to discover sports venues in your area</p>

        <button onclick="requestLocation()" class="btn btn-primary btn-block btn-lg" style="max-width: 300px;">
            📍 Allow Location Access
        </button>

        <div class="divider">or</div>
        
        <p class="mb-16 fw-600 text-secondary">Select your city manually</p>
        
        <div class="city-pills">
            <div class="city-pill" onclick="selectCity('Kollam')">Kollam</div>
            <div class="city-pill" onclick="selectCity('Kochi')">Kochi</div>
            <div class="city-pill" onclick="selectCity('Trivandrum')">Trivandrum</div>
            <div class="city-pill" onclick="selectCity('Calicut')">Calicut</div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const loc = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            type: 'gps'
                        };
                        localStorage.setItem('slotit_location', JSON.stringify(loc));
                        showToast('Location updated', 'success');
                        setTimeout(() => window.location.href = 'home.html', 1000);
                    },
                    (error) => {
                        showToast('Location access denied. Please select a city.', 'error');
                    }
                );
            } else {
                showToast('Geolocation not supported by browser', 'error');
            }
        }

        function selectCity(cityName) {
            const cityData = {
                type: 'city',
                name: cityName
            };
            localStorage.setItem('slotit_location', JSON.stringify(cityData));
            showToast(`City set to ${cityName}`, 'success');
            setTimeout(() => window.location.href = 'home.html', 1000);
        }
    </script>
</body>
</html>
